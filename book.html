		<!-- CSS: forzar 4 columnas y gutter, manteniendo proporciones -->
		<style>
		/* CONTENEDOR: compensar el padding (gutter) */
		.grid.col4 {
		  margin-left: -10px;   /* - gutter */
		  margin-right: -10px;
		}
		
		/* ITEMS: ancho fijo por breakpoint y gutter mediante padding */
		.grid.col4 .grid-item {
		  box-sizing: border-box;
		  padding: 10px;                /* ← espacio entre fotos (ajusta si quieres) */
		  width: 25% !important;        /* 4 columnas en pantallas grandes */
		  float: left;                  /* compatibilidad con Isotope layouts */
		}
		
		/* Imágenes: mantener proporción original */
		.grid.col4 .grid-item img {
		  width: 100%;
		  height: auto;
		  display: block;
		  object-fit: contain; /* mantiene proporción exacta (no recorta) */
		}
		
		/* BREAKPOINTS (de mayor a menor): ajusta según tu diseño */
		@media (max-width: 1200px) {
		  .grid.col4 .grid-item { width: 33.333333% !important; } /* 3 columnas */
		}
		@media (max-width: 900px) {
		  .grid.col4 .grid-item { width: 50% !important; }       /* 2 columnas */
		}
		@media (max-width: 576px) {
		  .grid.col4 .grid-item { width: 100% !important; }      /* 1 columna */
		}
		</style>

		<script>
		  (function($){
		    $(document).ready(function(){
		
		      // Espera a que las imágenes carguen y luego init/re-layout Isotope
		      var $grid = $('.grid.col4');
		
		      if ($grid.length && typeof $.fn.imagesLoaded === 'function' && typeof $.fn.isotope === 'function') {
		        $grid.imagesLoaded().always( function() {
		          // Inicializa Isotope si no está inicializado aún
		          if (typeof $grid.data('isotope') === 'undefined') {
		            $grid.isotope({
		              itemSelector: '.grid-item',
		              percentPosition: true,
		              masonry: {
		                // usar el ancho del propio item
		                columnWidth: '.grid-item'
		              }
		            });
		          } else {
		            $grid.isotope('layout');
		          }
		        });
		
		        // Recalculamos layout al redimensionar ventana (debounced)
		        var resizeTimer;
		        $(window).on('resize', function(){
		          clearTimeout(resizeTimer);
		          resizeTimer = setTimeout(function(){
		            $grid.isotope('layout');
		          }, 150);
		        });
